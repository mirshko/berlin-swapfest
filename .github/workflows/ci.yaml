name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  astro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm astro check --minimumFailingSeverity hint
  prettier-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier:check
